[package]
name = "fitslook"
version = "1.0.0"
edition = "2021"
description = "A professional FITS file viewer for astronomy"
license = "GPL-3.0"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui_extras = { version = "0.31", features = ["all_loaders"] }
egui_plot = "0.31"
ndarray = "0.16"
colorous = "1"
image = "0.25"
url = "2"
byteorder = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true

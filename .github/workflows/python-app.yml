name: Build FITSViewer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------
  # BUILD FOR LINUX
  # ---------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller astropy matplotlib numpy pillow
        # Force specific version to avoid Linux private API errors
        pip install "PyQt6==6.7.1" "PyQt6-Qt6==6.7.2"

    - name: Generate Assets (Icon)
      run: |
        # Generate a temporary icon so PyInstaller doesn't fail
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"

    - name: Build with PyInstaller (Linux)
      run: |
        pyinstaller --onefile --windowed --name FITSLook \
        --add-data "app_icon.png:." \
        --hidden-import "numpy._core._exceptions" \
        --exclude-module "PyQt6.QtQml" \
        --exclude-module "PyQt6.QtQuick" \
        --exclude-module "PyQt6.QtSql" \
        --exclude-module "PyQt6.Qt3DCore" \
        --exclude-module "PyQt6.Qt3DRender" \
        --exclude-module "PyQt6.QtWebEngineCore" \
        --exclude-module "PyQt6.QtDesigner" \
        --exclude-module "PyQt6.QtBluetooth" \
        --exclude-module "PyQt6.QtMultimedia" \
        --exclude-module "PyQt6.QtNfc" \
        --exclude-module "PyQt6.QtPositioning" \
        --exclude-module "PyQt6.QtRemoteObjects" \
        --exclude-module "PyQt6.QtSensors" \
        --exclude-module "PyQt6.QtSerialPort" \
        --exclude-module "PyQt6.QtStateMachine" \
        --exclude-module "PyQt6.QtSvg" \
        --exclude-module "PyQt6.QtTest" \
        --exclude-module "PyQt6.QtWebChannel" \
        --exclude-module "PyQt6.QtWebSockets" \
        --exclude-module "PyQt6.QtXml" \
        --exclude-module "asdf" \
        --exclude-module "PySide6" \
        --exclude-module "PySide2" \
        --exclude-module "PyQt5" \
        fitsview.py

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITSLook-Linux
        path: dist/FITSLook

  # ---------------------------------------------------
  # BUILD FOR MACOS (Universal Compatibility)
  # ---------------------------------------------------
  build-macos:
    # Updated to 'macos-latest' (ARM64) to fix deprecation warning
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11 (x64 Mode)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        # CRITICAL: Force x64 architecture.
        # This makes the ARM runner use Rosetta 2 to download Intel Python.
        # This ensures we build an Intel binary that runs on BOTH Intel and Apple Silicon Macs.
        architecture: 'x64'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller astropy matplotlib numpy pillow PyQt6

    - name: Generate Assets (Icon)
      run: |
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"

    - name: Build with PyInstaller (macOS)
      run: |
        # Explicitly target x86_64 to ensure broad compatibility
        pyinstaller --onefile --windowed --name "FITSLook" \
        --target-arch x86_64 \
        --osx-bundle-identifier "com.astro.fitslook" \
        --add-data "app_icon.png:." \
        --exclude-module asdf \
        --exclude-module PySide6 \
        --hidden-import numpy._core._exceptions \
        fitsview.py

    - name: Update Info.plist & Re-Sign
      run: |
        # 1. Inject File Associations
        python3 -c "
        import plistlib
        plist_path = 'dist/FITSLook.app/Contents/Info.plist'
        with open(plist_path, 'rb') as f:
            pl = plistlib.load(f)
        pl['CFBundleDocumentTypes'] = [{
            'CFBundleTypeName': 'FITS Image',
            'CFBundleTypeRole': 'Viewer',
            'LSHandlerRank': 'Owner',
            'CFBundleTypeExtensions': ['fits', 'fit', 'fts']
        }]
        with open(plist_path, 'wb') as f:
            plistlib.dump(pl, f)
        "
        
        # 2. Re-Sign the App (Ad-Hoc)
        codesign --force --deep -s - dist/FITSLook.app

    - name: Zip the App Bundle
      run: |
        cd dist
        ditto -c -k --keepParent FITSLook.app FITSLook-macOS.zip

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITSLook-macOS
        path: dist/FITSLook-macOS.zip

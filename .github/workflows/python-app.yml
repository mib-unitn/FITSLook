name: Build FITSViewer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ... (build-linux job remains unchanged) ...
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ... (Linux setup and build steps remain unchanged) ...
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller astropy matplotlib numpy pillow
          pip install "PyQt6==6.7.1" "PyQt6-Qt6==6.7.2"
      - name: Generate Icon
        run: |
          python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"
      - name: Build Binary
        run: |
          pyinstaller --onefile --windowed --name FITSLook \
          --add-data "app_icon.png:." \
          --hidden-import "numpy._core._exceptions" \
          --exclude-module "PyQt6.QtQml" --exclude-module "PyQt6.QtQuick" \
          --exclude-module "PyQt6.QtSql" --exclude-module "PyQt6.Qt3DCore" \
          --exclude-module "PyQt6.Qt3DRender" --exclude-module "PyQt6.QtWebEngineCore" \
          --exclude-module "PyQt6.QtDesigner" --exclude-module "PyQt6.QtBluetooth" \
          --exclude-module "PyQt6.QtMultimedia" --exclude-module "PyQt6.QtNfc" \
          --exclude-module "PyQt6.QtPositioning" --exclude-module "PyQt6.QtRemoteObjects" \
          --exclude-module "PyQt6.QtSensors" --exclude-module "PyQt6.QtSerialPort" \
          --exclude-module "PyQt6.QtStateMachine" --exclude-module "PyQt6.QtSvg" \
          --exclude-module "PyQt6.QtTest" --exclude-module "PyQt6.QtWebChannel" \
          --exclude-module "PyQt6.QtWebSockets" --exclude-module "PyQt6.QtXml" \
          --exclude-module "asdf" --exclude-module "PySide6" --exclude-module "PySide2" \
          --exclude-module "PyQt5" \
          fitsview.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FITSLook-Linux
          path: dist/FITSLook

  # ===================================================
  # 2. BUILD FOR MACOS (INTEL) - CRITICAL FIXES HERE
  # ===================================================
  build-macos-intel:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11 (Intel x64)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        architecture: 'x64' 

    - name: Install Dependencies (Force x86_64)
      run: |
        arch -x86_64 python -m pip install --upgrade pip
        # CRITICAL: Collect all Astropy/Matplotlib dependencies to ensure C-libraries are found
        arch -x86_64 python -m pip install pyinstaller astropy matplotlib numpy pillow PyQt6

    - name: Generate Assets
      run: |
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"

    - name: Build Intel App
      run: |
        # CRITICAL: Add --collect-all for astropy and matplotlib
        arch -x86_64 python -m PyInstaller --onefile --windowed --name "FITSLook" \
        --target-arch x86_64 \
        --osx-bundle-identifier "com.astro.fitslook" \
        --add-data "app_icon.png:." \
        --collect-all astropy \
        --collect-all matplotlib \
        --exclude-module asdf \
        --exclude-module PySide6 \
        --hidden-import numpy._core._exceptions \
        fitsview.py

    - name: Update Info.plist & Re-Sign
      run: |
        python3 -c "import plistlib; p='dist/FITSLook.app/Contents/Info.plist'; pl=plistlib.load(open(p,'rb')); pl['CFBundleDocumentTypes']=[{'CFBundleTypeName':'FITS Image','CFBundleTypeRole':'Viewer','LSHandlerRank':'Owner','CFBundleTypeExtensions':['fits','fit','fts']}]; plistlib.dump(pl,open(p,'wb'))"
        codesign --force --deep -s - dist/FITSLook.app

    - name: Zip and Upload
      run: |
        cd dist
        mv FITSLook.app FITSLook-Intel.app
        ditto -c -k --keepParent FITSLook-Intel.app FITSLook-macOS-Intel.zip
    
    - uses: actions/upload-artifact@v4
      with:
        name: FITSLook-macOS-Intel
        path: dist/FITSLook-macOS-Intel.zip

  # ===================================================
  # 3. BUILD FOR MACOS (APPLE SILICON) - CRITICAL FIXES HERE
  # ===================================================
  build-macos-arm:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11 (ARM64)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        architecture: 'arm64' 

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller astropy matplotlib numpy pillow PyQt6

    - name: Generate Assets
      run: |
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"

    - name: Build ARM App
      run: |
        # CRITICAL: Add --collect-all for astropy and matplotlib
        pyinstaller --onefile --windowed --name "FITSLook" \
        --target-arch arm64 \
        --osx-bundle-identifier "com.astro.fitslook" \
        --add-data "app_icon.png:." \
        --collect-all astropy \
        --collect-all matplotlib \
        --exclude-module asdf \
        --exclude-module PySide6 \
        --hidden-import numpy._core._exceptions \
        fitsview.py

    - name: Update Info.plist & Re-Sign
      run: |
        python3 -c "import plistlib; p='dist/FITSLook.app/Contents/Info.plist'; pl=plistlib.load(open(p,'rb')); pl['CFBundleDocumentTypes']=[{'CFBundleTypeName':'FITS Image','CFBundleTypeRole':'Viewer','LSHandlerRank':'Owner','CFBundleTypeExtensions':['fits','fit','fts']}]; plistlib.dump(pl,open(p,'wb'))"
        codesign --force --deep -s - dist/FITSLook.app

    - name: Zip and Upload
      run: |
        cd dist
        mv FITSLook.app FITSLook-AppleSilicon.app
        ditto -c -k --keepParent FITSLook-AppleSilicon.app FITSLook-macOS-AppleSilicon.zip
    
    - uses: actions/upload-artifact@v4
      with:
        name: FITSLook-macOS-AppleSilicon
        path: dist/FITSLook-macOS-AppleSilicon.zip

  # ===================================================
  # 4. CREATE RELEASE (Triggers only on Tags)
  # ===================================================
  release:
    needs: [build-linux, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          LOG=$(git log --pretty=format:"* %s (%h)" $PREV_TAG..HEAD)
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes in this Release
            ${{ steps.changelog.outputs.commits }}
          files: |
            artifacts/FITSLook-Linux/FITSLook
            artifacts/FITSLook-macOS-Intel/FITSLook-macOS-Intel.zip
            artifacts/FITSLook-macOS-AppleSilicon/FITSLook-macOS-AppleSilicon.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

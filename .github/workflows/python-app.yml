name: Build FITSViewer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------
  # BUILD FOR LINUX
  # ---------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install System Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1-mesa-glx

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller astropy matplotlib numpy pillow
        # Force specific version to avoid Linux private API errors
        pip install "PyQt6==6.7.1" "PyQt6-Qt6==6.7.2"

    - name: Generate Assets (Icon)
      run: |
        # Generate a temporary icon so PyInstaller doesn't fail
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"

    - name: Build with PyInstaller (Linux)
      run: |
        pyinstaller --onefile --windowed --name FITSLook \
        --add-data "app_icon.png:." \
        --hidden-import "numpy._core._exceptions" \
        --exclude-module "PyQt6.QtQml" \
        --exclude-module "PyQt6.QtQuick" \
        --exclude-module "PyQt6.QtSql" \
        --exclude-module "PyQt6.Qt3DCore" \
        --exclude-module "PyQt6.Qt3DRender" \
        --exclude-module "PyQt6.QtWebEngineCore" \
        --exclude-module "PyQt6.QtDesigner" \
        --exclude-module "PyQt6.QtBluetooth" \
        --exclude-module "PyQt6.QtMultimedia" \
        --exclude-module "PyQt6.QtNfc" \
        --exclude-module "PyQt6.QtPositioning" \
        --exclude-module "PyQt6.QtRemoteObjects" \
        --exclude-module "PyQt6.QtSensors" \
        --exclude-module "PyQt6.QtSerialPort" \
        --exclude-module "PyQt6.QtStateMachine" \
        --exclude-module "PyQt6.QtSvg" \
        --exclude-module "PyQt6.QtTest" \
        --exclude-module "PyQt6.QtWebChannel" \
        --exclude-module "PyQt6.QtWebSockets" \
        --exclude-module "PyQt6.QtXml" \
        --exclude-module "asdf" \
        --exclude-module "PySide6" \
        --exclude-module "PySide2" \
        --exclude-module "PyQt5" \
        fitsview.py

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITSLook-Linux
        path: dist/FITSLook

  # ---------------------------------------------------
  # BUILD FOR MACOS
  # ---------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller astropy matplotlib numpy pillow PyQt6

    - name: Generate Assets (Icon & Plist)
      run: |
        # Generate Icon
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (15, 17, 26, 255)); d = ImageDraw.Draw(img); d.ellipse((28, 28, 228, 228), outline=(88, 166, 255), width=10); img.save('app_icon.png')"
        
        # Generate Info.plist for Finder Integration
        cat <<EOF > info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDocumentTypes</key>
            <array>
                <dict>
                    <key>CFBundleTypeName</key>
                    <string>FITS Image</string>
                    <key>CFBundleTypeRole</key>
                    <string>Viewer</string>
                    <key>LSHandlerRank</key>
                    <string>Owner</string>
                    <key>CFBundleTypeExtensions</key>
                    <array>
                        <string>fits</string>
                        <string>fit</string>
                        <string>fts</string>
                    </array>
                </dict>
            </array>
        </dict>
        </plist>
        EOF

    - name: Build with PyInstaller (macOS)
      run: |
        pyinstaller --onefile --windowed --name "FITSLook" \
        --osx-bundle-identifier "com.astro.fitslook" \
        --add-data "app_icon.png:." \
        --extras-bundle-info info.plist \
        --exclude-module asdf \
        --exclude-module PySide6 \
        --hidden-import numpy._core._exceptions \
        fitsview.py

    - name: Zip the App Bundle
      run: |
        cd dist
        ditto -c -k --keepParent FITSLook.app FITSLook-macOS.zip

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITSLook-macOS
        path: dist/FITSLook-macOS.zip
